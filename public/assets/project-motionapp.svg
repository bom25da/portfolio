<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1050" viewBox="0 0 900 1050">
  <title>MotionApp milling machine integration concept</title>
  <desc>A machine interface connects NC files and controls to live progress, alarms and homing status.</desc>
